<div class="shell">
  <div class="loading-bar" *ngIf="isLoading()"></div>

  <div class="wake-overlay" *ngIf="showWakeMessage()">
    <div class="wake-card card">
      <div class="spinner"></div>
      <p class="wake-title">Despertando el servidor…</p>
      <p class="wake-hint">
        El backend vive en un plan gratuito y se duerme si nadie lo usa.
        Puede tardar hasta un minuto en arrancar la primera vez.
      </p>
    </div>
  </div>

  <header class="topbar">
    <a class="brand" routerLink="/">
      <img class="brand-icon" src="logo-cuervos.jpg" alt="Los Cuervos MC" />
      <span class="brand-text">
        <strong>LOS CUERVOS</strong>
        <small>Ruleta del Amigo Secreto</small>
      </span>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/miembros" routerLinkActive="active">Miembros</a>
      <a routerLink="/ruleta" routerLinkActive="active">Ruleta</a>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="foot">
    <span>Rodando juntos desde el asfalto 🏍️</span>
    <a
      class="credit"
      href="https://www.tiktok.com/@danibiker_08"
      target="_blank"
      rel="noopener noreferrer"
    >
      Hecho por &#64;danibiker_08
    </a>
  </footer>
</div>

<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <img class="brand-icon" src="logo-cuervos.jpg" alt="Los Cuervos MC" />
      <span class="brand-text">
        <strong>LOS CUERVOS</strong>
        <small>Ruleta del Amigo Secreto</small>
      </span>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/miembros" routerLinkActive="active">Miembros</a>
      <a routerLink="/ruleta" routerLinkActive="active">Ruleta</a>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="foot">
    <span>Rodando juntos desde el asfalto 🏍️</span>
  </footer>
</div>
